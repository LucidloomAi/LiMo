app = "game"
used = "36m"
lease_left = "9m"
away_left = "30m"
warned_blocked = [15, 5]
expect = { warning = "none", next_check = "Wed 2026-11-18 20:59" }

[[case]]
name = "A phone in New York at 10:25 its own time is at 20:55 at home in India"
rules = "school_week"
device_time = "2026-11-18 10:25 -05:00"
app = "game"
used = "86m"
lease_left = "4m"
expect = { allowed = true, left = "4m", warning = "5 minutes before time runs out", next_check = "Wed 2026-11-18 20:58" }

[[case]]
name = "A phone in London just after its own midnight is at 05:30 at home, still bedtime"
rules = "school_week"
device_time = "2026-11-19 00:00 +00:00"
app = "game"
away_left = "45m"
expect = { allowed = false, reason = "blocked hours", until = "Thu 2026-11-19 07:00" }

[[case]]
name = "A family in New York: Tuesday 23:30 at home is already Wednesday in UTC, but still Tuesday"
rules = "new_york_home"
time = "Tue 2026-11-17 23:30"
app = "game"
lease_left = "10m"
expect = { allowed = true, left = "10m" }

[[case]]
name = "Half an hour later it is Wednesday at home, a day with no time"
rules = "new_york_home"
time = "Wed 2026-11-18 00:00"
app = "game"
expect = { allowed = false, reason = "no time today", until = "Thu 2026-11-19 00:00" }

[[case]]
name = "The New York family's phone in India: 09:30 there is 23:00 on Tuesday at home"
rules = "new_york_home"
device_time = "2026-11-18 09:30 +05:30"
app = "game"
lease_left = "10m"
expect = { allowed = true, next_check = "Tue 2026-11-17 23:05" }

[[case]]
