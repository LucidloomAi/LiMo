# Rules checks: what the guardian's screen must refuse, in the words it uses.
# `problems` lists words each problem must contain; there must be no others.

[[rules_check]]
name = "The school week rules are fine"
rules = "school_week"
problems = []

[[rules_check]]
name = "A bedtime that starts and ends at the same minute is refused"
rules = "bad_window"
problems = ["starts and ends at 21:00"]

[[rules_check]]
name = "An app cannot be both always allowed and blocked"
rules = "both_lists"
problems = ["both always allowed and blocked"]

[[rules_check]]
name = "Every problem is reported, not only the first"
rules = "many_mistakes"
problems = ["more than a whole day", "has no days", "away share is 150 percent", "lease is 0 minutes"]
