time = "Wed 2026-11-18 18:00"
app = "game"
used = "89m 10s"
lease_left = "50s"
warned_time = [15, 5]
expect = { allowed = true, left = "50s", warning = "1 minute before time runs out", next_check = "Wed 2026-11-18 18:00:50" }

[[case]]
name = "After more time arrives the warnings can come again"
rules = "school_week"
time = "Wed 2026-11-18 18:00"
app = "game"
used = "50m"
lease_left = "10m"
away_left = "20m"
warned_time = [15, 5]
expect = { warning = "none", warned_time = [] }

[[case]]
name = "Bedtime in 15 minutes with plenty of time: the warning is about bedtime"
