time = "Wed 2026-11-18 22:00"
app = "casino"
expect = { allowed = false, reason = "app blocked", device_reason = "blocked hours" }

[[case]]
name = "Fourteen minutes left: the 15 minute warning"
rules = "school_week"
time = "Wed 2026-11-18 18:00"
app = "game"
used = "76m"
lease_left = "10m"
