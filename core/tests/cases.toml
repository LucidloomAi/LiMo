time = "Mon 2026-11-23 10:00"
app = "clock"
expect = { allowed = true, counts = false, device_reason = "no time today" }

[[case]]
name = "The phone app works at bedtime"
rules = "school_week"
time = "Wed 2026-11-18 23:00"
app = "phone"
expect = { allowed = true, reason = "none", counts = false, device_reason = "blocked hours" }

[[case]]
name = "TutorBee works with no time left, and does not count"
