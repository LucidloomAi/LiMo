[package]
name = "limo-spike-windows-lock"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Throwaway proof: a Windows service that locks every monitor through a helper in the user session"
publish = false

[[bin]]
name = "limo-spike"
path = "src/main.rs"

[dependencies]
windows-service = "0.8.1"

[dependencies.windows]
version = "0.62.2"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Environment",
    "Win32_System_LibraryLoader",
    "Win32_System_RemoteDesktop",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
]

[profile.release]
opt-level = 2
