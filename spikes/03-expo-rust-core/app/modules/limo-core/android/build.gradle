plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'ai.lucidloom.limo'
version = '0.1.0'

// Written by scripts/build-core.mjs, git ignored:
//   src/generated/kotlin   the UniFFI Kotlin bindings
//   src/generated/jniLibs  liblimo_core_spike.so for each ABI
def generatedDir = file('src/generated')
def spikeDir = file('../../../..')
def coreDir = new File(spikeDir, 'core')
def buildScript = new File(spikeDir, 'app/scripts/build-core.mjs')

android {
  namespace 'ai.lucidloom.limo.core'
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
  }
  sourceSets {
    main {
      java.srcDirs += new File(generatedDir, 'kotlin')
      jniLibs.srcDirs += new File(generatedDir, 'jniLibs')
    }
  }
}

dependencies {
  // The UniFFI Kotlin bindings call Rust through JNA. The aar carries JNA's
  // own native library, libjnidispatch.so, for each ABI.
  implementation 'net.java.dev.jna:jna:5.19.1@aar'
}

// Builds the Rust core and regenerates the bindings before anything in this
// module is compiled. The ABIs follow the app's reactNativeArchitectures, so
// the Rust library and React Native always cover the same ABIs. Gradle skips
// the task when none of the inputs below changed.
def abis = (findProperty('reactNativeArchitectures') ?: 'arm64-v8a').toString()
def buildRustCore = tasks.register('buildRustCore', Exec) {
  group = 'build'
  description = 'Builds the Rust core for Android and generates the Kotlin bindings.'
  inputs.dir(new File(coreDir, 'src'))
  inputs.files(
    new File(coreDir, 'Cargo.toml'),
    new File(coreDir, 'Cargo.lock'),
    new File(coreDir, 'uniffi.toml'),
    new File(coreDir, 'uniffi-bindgen.rs'),
    buildScript
  )
  inputs.property('abis', abis)
  outputs.dir(generatedDir)
  environment 'LIMO_ABIS', abis
  commandLine 'node', buildScript.absolutePath
}
tasks.named('preBuild') { dependsOn buildRustCore }
