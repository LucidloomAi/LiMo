[package]
name = "limo-console-proof"
version = "0.1.0"
description = "LiMo spike 06: the guardian console as the Expo web export in a Tauri window"
license = "Apache-2.0"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The size settings Tauri's documentation suggests for release builds.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
