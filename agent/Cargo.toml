[package]
name = "limo-agent"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
description = "LiMo agent engine: what happens, second by second, in each Windows session on the master PC"
publish = false

[lib]
name = "limo_agent"

[dependencies]
# The rules core: every decision, and the device side of the shared budget.
limo-core = { path = "../core" }
# The family's file on the master PC: the books, the accounts, the PC's own
# device states.
limo-hub = { path = "../hub" }
# The facts and the orders are plain data; the agent's own notes are kept in
# the hub's file as JSON.
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[dev-dependencies]
# Real files in temporary folders.
tempfile = "3.27.0"
# Looking inside the family's file, and making a write fail, in the tests.
rusqlite = { version = "0.43.0", default-features = false, features = ["bundled"] }

# The guardian password and the PIN are hashed slowly on purpose. Optimised
# dependencies in debug and test builds (the hub, the core, SQLite and the
# hashing crates) keep them as fast as they are in the product; this crate
# gets a little optimisation for the long simulated runs. Overflow checks
# stay on.
[profile.dev]
opt-level = 1
[profile.test]
opt-level = 1
[profile.dev.package."*"]
opt-level = 3
[profile.test.package."*"]
opt-level = 3
