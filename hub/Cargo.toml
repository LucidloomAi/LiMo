[package]
name = "limo-hub"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
description = "LiMo hub store: one family's children, devices, rules and usage in one SQLite file on the master PC"
publish = false

[lib]
name = "limo_hub"

[dependencies]
# The rules core: every rule, pool and grant is worked out there.
limo-core = { path = "../core" }
# One SQLite file. `bundled` builds SQLite into the program, so the master PC
# needs no SQLite of its own. Default features off: no statement cache, no
# WebAssembly backend.
rusqlite = { version = "0.43.0", default-features = false, features = ["bundled"] }
# The public types are plain data; the books are kept as JSON.
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# Random ids, salts and code secrets, from the operating system.
getrandom = "0.4.3"
# The guardian password: PBKDF2-HMAC-SHA256 and a constant time comparison,
# the same RustCrypto crates and versions the core uses for the PIN.
sha2 = { version = "0.11.1", default-features = false }
pbkdf2 = { version = "0.13.0", default-features = false, features = ["hmac"] }
ctutils = { version = "0.4.8", default-features = false }
# Wiping the master's private key and the pairing offers the hub hands out,
# when they are dropped: the same crate and version the link uses.
zeroize = { version = "1.9.0", default-features = false, features = ["alloc"] }

[dev-dependencies]
# Real files in temporary folders.
tempfile = "3.27.0"

# The password and PIN hashes are slow on purpose. Optimised dependencies in
# debug and test builds (the hashing crates and the pieces under them, and
# SQLite) keep them close to as fast as they are in the product, so the tests
# take seconds. The hashing is generic code, compiled inside the crate that
# calls it, so this crate gets a little optimisation too; overflow checks stay
# on.
[profile.dev]
opt-level = 1
[profile.test]
opt-level = 1
[profile.dev.package."*"]
opt-level = 3
[profile.test.package."*"]
opt-level = 3
