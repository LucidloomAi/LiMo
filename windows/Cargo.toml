[package]
name = "limo-windows"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
description = "LiMo for Windows: the service on the master PC, and its helper in each signed in session"
publish = false

[lib]
name = "limo_windows"

[[bin]]
name = "limo"
path = "src/main.rs"

[dependencies]
# The engine: facts in, orders out.
limo-agent = { path = "../agent" }
# The family's file.
limo-hub = { path = "../hub" }
# The rules core, for the types the engine and the hub hand over.
limo-core = { path = "../core" }
# The screens the helper draws: the lock screen, the time left display and
# its notices, drawn in software to the agreed design.
limo-screens = { path = "../screens" }
# The encrypted link with the family's phones: its frames, handshakes and
# offers. The service owns the sockets; the link has none.
limo-link = { path = "../link" }
# Announcing the master on the home network (mDNS), on the PC's private
# IPv4 networks only. The version proof four ran; no async runtime, no
# logging.
mdns-sd = { version = "=0.22.0", default-features = false }
# The PC's own IPv4 addresses, for the pairing offer and to choose where to
# announce: the same crate mdns-sd uses.
if-addrs = "0.15.0"
# The channel's messages and the data folder's settings file are JSON.
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# Wiping a typed PIN or code from memory when it is no longer needed.
zeroize = { version = "1.9.0", default-features = false, features = ["alloc"] }

[target.'cfg(windows)'.dependencies]
# The service control manager: the same crate and version as the first spike.
windows-service = "0.8.1"

[target.'cfg(windows)'.dependencies.windows]
# Windows itself: the same version as the first spike.
version = "0.62.2"
features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    # Whether a program of the session plays sound: the sound devices, their
    # audio sessions and each one's loudness meter. Nothing is ever recorded.
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    # The accounts of this PC and the Administrators group's members, for
    # the guardian to say whose each account is.
    "Win32_NetworkManagement_NetManagement",
    # Which process is at the other end of a loopback connection to the
    # link, so that one from a child's account is closed at once.
    "Win32_NetworkManagement_IpHelper",
    # LiMo's two rules in Windows' firewall, made at install and removed at
    # uninstall through the firewall's own interface.
    "Win32_NetworkManagement_WindowsFirewall",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    # COM, for the sound devices; the two after it are what activating an
    # interface on a sound device needs in this crate.
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Console",
    "Win32_System_Environment",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Pipes",
    # Whether a program keeps the screen awake: the PC's execution state.
    "Win32_System_Power",
    "Win32_System_RemoteDesktop",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_System_Variant",
    "Win32_System_WindowsProgramming",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[features]
# A phone played over the link, for the tests and the example program.
# Never part of the service.
played-phone = []
# A small host of the console's door, for other crates' tests: the real
# service and door on a named pipe of the test's own, with no Os of their
# own to implement. Never part of the service.
door-host = []

[dev-dependencies]
# A real family file in a temporary folder, for the stories.
tempfile = "3.27.0"
# The tests and the example play a phone over real loopback sockets.
limo-windows = { path = ".", features = ["played-phone", "door-host"] }
# Tests only: a loopback socket bound to its own port before it connects,
# to play a program in a child's account. Already under mdns-sd.
socket2 = "0.6.5"

[[example]]
name = "limo-phone"
path = "examples/limo-phone.rs"

# The guardian password and the PIN are hashed slowly on purpose. Optimised
# dependencies in debug and test builds keep them as fast as they are in the
# product, as in the agent and the hub; overflow checks stay on.
[profile.dev]
opt-level = 1
[profile.test]
opt-level = 1
[profile.dev.package."*"]
opt-level = 3
[profile.test.package."*"]
opt-level = 3

[profile.release]
opt-level = 2
